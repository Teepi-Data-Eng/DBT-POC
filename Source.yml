version: 2

sources:
  - name: default
    description: "Raw ingestion tables from the lakehouse"
    catalog: main
    schema: default

    tables:
      - name: san_test
        description: "Raw customer ingestion table"

        config:
          loaded_at_field: review_date
          freshness:
            warn_after:
              count: 2
              period: hour
            error_after:
              count: 4
              period: hour
